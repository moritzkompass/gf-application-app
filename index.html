<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GF Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --milk: #f8f1ec;
    --white: #ffffff;
    --black: #1a1411;
    --text: #1a1411;
    --text-soft: rgba(26,20,17,0.6);
    --text-muted: rgba(26,20,17,0.4);
    --brand: #2a1d18;
    --brand-dark: #1a1411;
    --accent: #c1543c;
    --accent-soft: rgba(193,84,60,0.10);
    --accent-line: rgba(193,84,60,0.4);
    --line: #ece1d8;
    --line-strong: #d8c8be;
    --green: #5b8a4a;
    --green-soft: rgba(91,138,74,0.12);
    --amber: #b87c2c;
    --amber-soft: rgba(184,124,44,0.12);
    --red: #c0392b;
    --red-soft: rgba(192,57,43,0.10);
    --shadow: 0 4px 20px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.03);
    --shadow-lg: 0 24px 60px rgba(0,0,0,0.15), 0 1px 3px rgba(0,0,0,0.06);
  }
  html, body {
    background: var(--milk);
    color: var(--text);
    font-family: 'Inter Tight', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh; min-height: 100dvh;
  }

  /* ===== LOGIN ===== */
  .auth-wrap {
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
  }
  .auth-card {
    width: 100%; max-width: 380px;
    background: var(--white);
    border-radius: 1.25rem;
    padding: 2.25rem 2rem;
    box-shadow: var(--shadow);
  }
  .auth-card h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 0.35rem;
  }
  .auth-card p.lead {
    font-size: 0.92rem;
    color: var(--text-soft);
    margin-bottom: 1.75rem;
  }
  .auth-field {
    display: block;
    width: 100%;
    padding: 0.9rem 1rem;
    border: 1.5px solid var(--line);
    border-radius: 0.6rem;
    font-family: inherit;
    font-size: 0.95rem;
    background: var(--milk);
    color: var(--text);
    outline: none;
    margin-bottom: 0.7rem;
    transition: border-color .2s;
  }
  .auth-field:focus { border-color: var(--accent); background: var(--white); }
  .auth-field::placeholder { color: var(--text-muted); }
  .auth-btn {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.5rem;
    width: 100%;
    padding: 1rem;
    border: none;
    border-radius: 0.7rem;
    background: var(--brand);
    color: var(--white);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 0.5rem;
    transition: all .2s;
  }
  .auth-btn:hover { background: var(--brand-dark); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(42,29,24,0.22); }
  .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .auth-err {
    color: var(--red);
    font-size: 0.82rem;
    margin-top: 0.65rem;
    min-height: 1rem;
  }

  /* ===== APP SHELL ===== */
  .topbar {
    background: var(--white);
    border-bottom: 1px solid var(--line);
    padding: 0.85rem 1.5rem;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 5;
  }
  .topbar h1 {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.3px;
    display: inline-flex; align-items: center; gap: 0.5rem;
  }
  .topbar h1::before {
    content: '';
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px rgba(193,84,60,0.4);
  }
  .topbar .right {
    display: flex; align-items: center; gap: 0.85rem;
    font-size: 0.85rem;
    color: var(--text-soft);
  }
  .topbar a.signout {
    color: var(--text-soft);
    text-decoration: none;
    cursor: pointer;
    padding: 0.35rem 0.7rem;
    border-radius: 0.4rem;
    transition: all .2s;
  }
  .topbar a.signout:hover { background: var(--line); color: var(--text); }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 1.75rem 1.5rem 3rem;
  }
  @media (max-width: 640px) {
    .page { padding: 1.25rem 1rem 2.5rem; }
    .topbar { padding: 0.85rem 1rem; }
  }

  /* ===== STATS ===== */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.85rem;
    margin-bottom: 1.75rem;
  }
  @media (max-width: 640px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 0.85rem;
    padding: 1rem 1.1rem;
    box-shadow: var(--shadow);
  }
  .stat-label {
    font-size: 0.7rem;
    color: var(--text-soft);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 600;
    margin-bottom: 0.35rem;
  }
  .stat-value {
    font-size: 1.55rem;
    font-weight: 700;
    letter-spacing: -0.6px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .stat-value.accent { color: var(--accent); }

  /* ===== TABLE ===== */
  .table-card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 0.85rem;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .table-head-bar {
    padding: 0.95rem 1.1rem;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .table-title {
    font-weight: 600;
    font-size: 0.95rem;
  }
  .table-count {
    font-size: 0.78rem;
    color: var(--text-soft);
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    text-align: left;
    padding: 0.85rem 1.1rem;
    font-size: 0.88rem;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  th {
    font-weight: 600;
    color: var(--text-soft);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    background: var(--milk);
    border-bottom: 1px solid var(--line);
  }
  tr.row { cursor: pointer; transition: background .15s; }
  tr.row:hover { background: var(--milk); }
  tr.row:last-child td { border-bottom: none; }
  td.name { font-weight: 600; color: var(--text); }
  td.when { color: var(--text-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.kontakt { color: var(--text-soft); word-break: break-all; max-width: 220px; }
  td.typ { color: var(--text-soft); }
  td.actions { text-align: right; }

  .badge {
    display: inline-flex; align-items: center; gap: 0.3rem;
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .badge.neu { background: var(--accent-soft); color: var(--accent); }
  .badge.gelesen { background: var(--amber-soft); color: var(--amber); }
  .badge.passt { background: var(--green-soft); color: var(--green); }
  .badge.passt_nicht { background: var(--red-soft); color: var(--red); }

  .empty {
    padding: 4rem 2rem;
    text-align: center;
    color: var(--text-soft);
    font-size: 0.95rem;
  }
  .loading {
    padding: 4rem 2rem;
    text-align: center;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  /* ===== MODAL ===== */
  .modal-wrap {
    position: fixed; inset: 0;
    background: rgba(26,20,17,0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 100;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 1.5rem;
    overflow-y: auto;
  }
  .modal-wrap.open { display: flex; }
  .modal {
    background: var(--milk);
    width: 100%;
    max-width: 680px;
    border-radius: 1.1rem;
    box-shadow: var(--shadow-lg);
    margin: auto 0;
    animation: modalIn 0.25s cubic-bezier(.16,1,.3,1);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-head {
    padding: 1.4rem 1.6rem 1rem;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 1rem;
  }
  .modal-head h2 {
    font-size: 1.45rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 0.35rem;
  }
  .modal-meta {
    font-size: 0.82rem;
    color: var(--text-soft);
    display: flex; gap: 0.65rem;
    flex-wrap: wrap;
  }
  .modal-meta strong { color: var(--text); font-weight: 500; }
  .modal-close {
    background: transparent;
    border: none;
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    color: var(--text-soft);
    font-size: 1.4rem;
    line-height: 1;
    flex-shrink: 0;
    transition: all .2s;
  }
  .modal-close:hover { background: var(--line); color: var(--text); }
  .modal-body {
    padding: 1.4rem 1.6rem;
  }
  .modal-section { margin-bottom: 1.5rem; }
  .modal-section:last-child { margin-bottom: 0; }
  .modal-section h3 {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-soft);
    font-weight: 600;
    margin-bottom: 0.6rem;
  }
  .field-row {
    display: flex;
    gap: 1rem;
    padding: 0.55rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.92rem;
    line-height: 1.45;
  }
  .field-row:last-child { border-bottom: none; }
  .field-row .label {
    min-width: 140px;
    color: var(--text-soft);
    font-weight: 500;
  }
  .field-row .value {
    flex: 1;
    color: var(--text);
    word-break: break-word;
  }
  .field-row .value.empty { color: var(--text-muted); font-style: italic; }
  .chip-list { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .chip {
    display: inline-block;
    padding: 0.25rem 0.6rem;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .longtext {
    margin-top: 0.4rem;
    padding: 0.85rem 1rem;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 0.5rem;
    font-size: 0.92rem;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .media-card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 0.6rem;
    padding: 0.85rem;
    margin-top: 0.4rem;
  }
  .media-card audio, .media-card video { width: 100%; display: block; border-radius: 0.4rem; }
  .media-card video { max-height: 320px; background: #000; }
  .media-card a {
    display: inline-block;
    margin-top: 0.5rem;
    font-size: 0.78rem;
    color: var(--brand);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  /* ===== STATUS + NOTES ===== */
  .status-row {
    display: flex; gap: 0.45rem;
    flex-wrap: wrap;
    margin-bottom: 0.5rem;
  }
  .status-opt {
    padding: 0.5rem 0.85rem;
    border: 1.5px solid var(--line);
    border-radius: 0.5rem;
    background: var(--white);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    color: var(--text-soft);
    transition: all .15s;
  }
  .status-opt:hover { border-color: var(--accent-line); color: var(--text); }
  .status-opt.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .notes-area {
    width: 100%;
    min-height: 90px;
    padding: 0.85rem 1rem;
    border: 1.5px solid var(--line);
    border-radius: 0.6rem;
    font-family: inherit;
    font-size: 0.9rem;
    background: var(--white);
    color: var(--text);
    resize: vertical;
    outline: none;
    transition: border-color .2s;
  }
  .notes-area:focus { border-color: var(--accent); }
  .save-row {
    margin-top: 0.7rem;
    display: flex; align-items: center; gap: 0.65rem;
  }
  .btn {
    padding: 0.65rem 1.15rem;
    border: none;
    border-radius: 0.55rem;
    background: var(--brand);
    color: var(--white);
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
  }
  .btn:hover { background: var(--brand-dark); transform: translateY(-1px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn.danger { background: transparent; color: var(--red); font-weight: 500; }
  .btn.danger:hover { background: var(--red-soft); transform: none; }
  .save-status { font-size: 0.78rem; color: var(--text-soft); }
  .save-status.ok { color: var(--green); }
  .save-status.err { color: var(--red); }
</style>
</head>
<body>

<!-- LOADING -->
<div class="auth-wrap" id="loadingWrap">
  <div class="auth-card">
    <h1>GF Admin</h1>
    <p class="lead">Laden...</p>
  </div>
</div>

<!-- LOGIN -->
<div class="auth-wrap" id="loginWrap" style="display:none">
  <div class="auth-card">
    <h1>GF Admin</h1>
    <p class="lead">Sign in to view applications.</p>
    <input class="auth-field" id="email" type="email" autocomplete="email" placeholder="email">
    <input class="auth-field" id="password" type="password" autocomplete="current-password" placeholder="password">
    <button class="auth-btn" id="loginBtn" onclick="signIn()">Sign in</button>
    <div class="auth-err" id="loginErr"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="appWrap" style="display:none">
  <div class="topbar">
    <h1>GF Applications</h1>
    <div class="right">
      <span id="userEmail"></span>
      <a class="signout" onclick="signOut()">Sign out</a>
    </div>
  </div>

  <div class="page">
    <div class="stats">
      <div class="stat"><div class="stat-label">Total</div><div class="stat-value" id="statTotal">–</div></div>
      <div class="stat"><div class="stat-label">Neu</div><div class="stat-value accent" id="statNew">–</div></div>
      <div class="stat"><div class="stat-label">Diese Woche</div><div class="stat-value" id="statWeek">–</div></div>
      <div class="stat"><div class="stat-label">Mit Voice/Video</div><div class="stat-value" id="statMedia">–</div></div>
    </div>

    <div class="table-card">
      <div class="table-head-bar">
        <div class="table-title">Applications</div>
        <div class="table-count" id="tableCount">–</div>
      </div>
      <div id="tableBody" class="loading">Lade Daten...</div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-wrap" id="modalWrap" onclick="closeDetailIfBg(event)">
  <div class="modal" id="modal"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = 'https://lwjyhsdlqpohnttxoacr.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3anloc2RscXBvaG50dHhvYWNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyNjE4MTgsImV4cCI6MjA5MzgzNzgxOH0.c5EgX-Inzcb07WjeT0VXDmv7hAqoo5UGCvLf2ZeVQEA';

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let leads = [];
  let currentLead = null;
  const STATUS_OPTIONS = ['neu','gelesen','passt','passt_nicht'];
  const STATUS_LABELS = { neu:'Neu', gelesen:'Gelesen', passt:'Passt', passt_nicht:'Passt nicht' };

  const el = id => document.getElementById(id);
  function escHtml(s){
    if(s==null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function fmtRelative(iso){
    if(!iso) return '–';
    const then = new Date(iso).getTime();
    const diff = (Date.now() - then) / 1000;
    if(diff < 60) return 'gerade';
    if(diff < 3600) return Math.floor(diff/60) + 'm';
    if(diff < 86400) return Math.floor(diff/3600) + 'h';
    if(diff < 7*86400) return Math.floor(diff/86400) + 'd';
    return new Date(iso).toLocaleDateString('de-AT', { day:'2-digit', month:'short' });
  }
  function fmtFull(iso){
    if(!iso) return '–';
    return new Date(iso).toLocaleString('de-AT', { dateStyle:'medium', timeStyle:'short' });
  }

  async function init(){
    const { data } = await sb.auth.getSession();
    if(data && data.session){
      onSignedIn(data.session);
    } else {
      showLogin();
    }
  }

  function showLogin(){
    el('loadingWrap').style.display = 'none';
    el('appWrap').style.display = 'none';
    el('loginWrap').style.display = 'flex';
    setTimeout(()=> el('email').focus(), 50);
  }

  function showApp(){
    el('loadingWrap').style.display = 'none';
    el('loginWrap').style.display = 'none';
    el('appWrap').style.display = 'block';
  }

  async function onSignedIn(session){
    el('userEmail').textContent = session.user.email || '';
    showApp();
    await loadLeads();
  }

  window.signIn = async function(){
    const email = el('email').value.trim();
    const password = el('password').value;
    if(!email || !password) { el('loginErr').textContent = 'Email + Passwort bitte.'; return; }
    el('loginErr').textContent = '';
    el('loginBtn').disabled = true;
    el('loginBtn').textContent = '...';
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    el('loginBtn').disabled = false;
    el('loginBtn').textContent = 'Sign in';
    if(error){ el('loginErr').textContent = error.message; return; }
    onSignedIn(data.session);
  };

  el('password').addEventListener('keydown', e => { if(e.key === 'Enter') signIn(); });
  el('email').addEventListener('keydown', e => { if(e.key === 'Enter') el('password').focus(); });

  window.signOut = async function(){
    await sb.auth.signOut();
    location.reload();
  };

  async function loadLeads(){
    el('tableBody').className = 'loading';
    el('tableBody').textContent = 'Lade Daten...';
    const { data, error } = await sb
      .from('gf_applications')
      .select('*')
      .order('created_at', { ascending: false });
    if(error){
      el('tableBody').innerHTML = '<div class="empty" style="color:var(--red)">Fehler: ' + escHtml(error.message) + '</div>';
      console.error(error);
      return;
    }
    leads = data || [];
    renderStats();
    renderTable();
  }

  function renderStats(){
    const total = leads.length;
    const neu = leads.filter(l => l.status === 'neu').length;
    const weekAgo = Date.now() - 7*86400*1000;
    const week = leads.filter(l => new Date(l.created_at).getTime() > weekAgo).length;
    const media = leads.filter(l => l.message_url).length;
    el('statTotal').textContent = total;
    el('statNew').textContent = neu;
    el('statWeek').textContent = week;
    el('statMedia').textContent = media;
  }

  function renderTable(){
    if(!leads.length){
      el('tableBody').className = 'empty';
      el('tableBody').textContent = 'Noch keine Bewerbungen.';
      el('tableCount').textContent = '0';
      return;
    }
    el('tableCount').textContent = leads.length;
    el('tableBody').className = '';
    let html = '<table><thead><tr>'
      + '<th>Wann</th><th>Name</th><th>Kontakt</th><th>Sucht</th><th>Status</th><th></th>'
      + '</tr></thead><tbody>';
    leads.forEach(l => {
      const status = l.status || 'neu';
      html += '<tr class="row" onclick="openDetail(\''+l.id+'\')">'
        + '<td class="when">' + escHtml(fmtRelative(l.created_at)) + '</td>'
        + '<td class="name">' + escHtml(l.name || '–') + '</td>'
        + '<td class="kontakt">' + escHtml(l.kontakt || '–') + '</td>'
        + '<td class="typ">' + escHtml(l.typ || '–') + '</td>'
        + '<td><span class="badge ' + escHtml(status) + '">' + escHtml(STATUS_LABELS[status] || status) + '</span></td>'
        + '<td class="actions" style="color:var(--text-muted);font-size:1.1rem">›</td>'
        + '</tr>';
    });
    html += '</tbody></table>';
    el('tableBody').innerHTML = html;
  }

  // ===== DETAIL MODAL =====
  window.openDetail = function(id){
    const lead = leads.find(l => l.id === id);
    if(!lead) return;
    currentLead = lead;
    renderModal(lead);
    el('modalWrap').classList.add('open');
    document.body.style.overflow = 'hidden';
  };
  window.closeDetail = function(){
    el('modalWrap').classList.remove('open');
    document.body.style.overflow = '';
    currentLead = null;
  };
  window.closeDetailIfBg = function(e){
    if(e.target.id === 'modalWrap') closeDetail();
  };
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && el('modalWrap').classList.contains('open')) closeDetail();
  });

  function row(label, value, isLong){
    const isEmpty = value == null || value === '' || (Array.isArray(value) && !value.length);
    const safeVal = isEmpty ? '–' : (
      Array.isArray(value)
        ? '<span class="chip-list">' + value.map(v => '<span class="chip">'+escHtml(v)+'</span>').join('') + '</span>'
        : escHtml(value)
    );
    if(isLong && !isEmpty){
      return '<div class="field-row"><div class="label">' + escHtml(label) + '</div>'
        + '<div class="value"><div class="longtext">' + escHtml(value) + '</div></div></div>';
    }
    return '<div class="field-row"><div class="label">' + escHtml(label) + '</div>'
      + '<div class="value' + (isEmpty?' empty':'') + '">' + safeVal + '</div></div>';
  }

  function renderModal(lead){
    let h = '';
    h += '<div class="modal-head">'
      + '<div>'
      +   '<h2>' + escHtml(lead.name || '–') + '</h2>'
      +   '<div class="modal-meta">'
      +     '<span>' + escHtml(fmtFull(lead.created_at)) + '</span>'
      +     '<span>·</span>'
      +     '<span><strong>' + escHtml(lead.kontakt || '–') + '</strong></span>'
      +   '</div>'
      + '</div>'
      + '<button class="modal-close" onclick="closeDetail()" aria-label="Schließen">×</button>'
      + '</div>';

    h += '<div class="modal-body">';

    // Status section
    h += '<div class="modal-section">'
      + '<h3>Status</h3>'
      + '<div class="status-row">';
    STATUS_OPTIONS.forEach(s => {
      h += '<button class="status-opt' + ((lead.status||'neu')===s?' active':'') + '" data-status="' + s + '" onclick="setStatus(\''+s+'\')">' + escHtml(STATUS_LABELS[s]) + '</button>';
    });
    h += '</div></div>';

    // Persönlichkeit
    h += '<div class="modal-section"><h3>Persönlichkeit</h3>'
      + row('Sucht', lead.typ)
      + row('Adjektive', lead.adjektive)
      + row('Sonntag, 11 Uhr', lead.sonntag)
      + row('Lieblingswort', lead.rapid_lieblingswort)
      + row('Letzter Ohrwurm', lead.rapid_ohrwurm)
      + row('Hat immer dabei', lead.rapid_bag)
      + '</div>';

    // Verbindung
    h += '<div class="modal-section"><h3>Verbindung</h3>'
      + row('Green Flags', lead.greenflags, true)
      + row('Interesse-Tell', lead.interesse, true)
      + row('Love Language', lead.love_lang)
      + row('Glücklich machen', lead.happy
          + (lead.happy_text ? ' — „' + lead.happy_text + '"' : ''))
      + '</div>';

    // Date + Comms
    h += '<div class="modal-section"><h3>Date & Kommunikation</h3>'
      + row('Date-Wahl', lead.date_wahl
          + (lead.date_text ? ' — „' + lead.date_text + '"' : ''))
      + row('Voicenote vs Text', lead.comms)
      + row('Frage zurück', lead.rueckfrage, true)
      + '</div>';

    // Message
    h += '<div class="modal-section"><h3>Nachricht</h3>';
    if(lead.message_url){
      const isVideo = lead.message_type === 'video';
      h += '<div class="field-row"><div class="label">' + (isVideo?'Video':'Sprachnachricht') + '</div>'
        + '<div class="value"><div class="media-card">'
        + (isVideo
            ? '<video src="'+escHtml(lead.message_url)+'" controls playsinline></video>'
            : '<audio src="'+escHtml(lead.message_url)+'" controls></audio>')
        + (lead.message_duration_sec ? '<div style="font-size:0.78rem;color:var(--text-soft);margin-top:0.4rem">Dauer: '+lead.message_duration_sec+'s</div>' : '')
        + '<a href="'+escHtml(lead.message_url)+'" target="_blank" rel="noopener">Direkt-Link öffnen</a>'
        + '</div></div></div>';
    } else if(lead.message_text){
      h += row('Text', lead.message_text, true);
    } else {
      h += '<div class="field-row"><div class="label">Nachricht</div><div class="value empty">–</div></div>';
    }
    h += '</div>';

    // Notizen
    h += '<div class="modal-section"><h3>Notizen</h3>'
      + '<textarea class="notes-area" id="notesArea" placeholder="Deine Gedanken zu dieser Bewerbung...">'+escHtml(lead.notes||'')+'</textarea>'
      + '<div class="save-row">'
      + '<button class="btn" id="saveBtn" onclick="saveLead()">Speichern</button>'
      + '<span class="save-status" id="saveStatus"></span>'
      + '<button class="btn danger" style="margin-left:auto" onclick="deleteLead()">Löschen</button>'
      + '</div></div>';

    // Meta
    h += '<div class="modal-section"><h3>Meta</h3>'
      + row('User Agent', lead.user_agent)
      + row('Referrer', lead.referrer_url)
      + row('Lead-ID', lead.id)
      + '</div>';

    h += '</div>';
    el('modal').innerHTML = h;
  }

  window.setStatus = function(s){
    if(!currentLead) return;
    currentLead.status = s;
    document.querySelectorAll('.status-opt').forEach(b => {
      b.classList.toggle('active', b.dataset.status === s);
    });
  };

  window.saveLead = async function(){
    if(!currentLead) return;
    const notes = el('notesArea').value;
    const status = currentLead.status;
    el('saveBtn').disabled = true;
    el('saveStatus').className = 'save-status';
    el('saveStatus').textContent = 'Speichere...';
    const { error } = await sb
      .from('gf_applications')
      .update({ status, notes })
      .eq('id', currentLead.id);
    el('saveBtn').disabled = false;
    if(error){
      el('saveStatus').className = 'save-status err';
      el('saveStatus').textContent = error.message;
      return;
    }
    el('saveStatus').className = 'save-status ok';
    el('saveStatus').textContent = 'Gespeichert.';
    // Update local copy
    const idx = leads.findIndex(l => l.id === currentLead.id);
    if(idx >= 0){
      leads[idx].status = status;
      leads[idx].notes = notes;
    }
    renderStats();
    renderTable();
    setTimeout(() => { if(el('saveStatus')) { el('saveStatus').className = 'save-status'; el('saveStatus').textContent = ''; } }, 2500);
  };

  window.deleteLead = async function(){
    if(!currentLead) return;
    if(!confirm('Diese Bewerbung wirklich löschen?')) return;
    const { error } = await sb
      .from('gf_applications')
      .delete()
      .eq('id', currentLead.id);
    if(error){
      alert('Fehler: ' + error.message);
      return;
    }
    leads = leads.filter(l => l.id !== currentLead.id);
    closeDetail();
    renderStats();
    renderTable();
  };

  // Auth state listener (handles token refresh / signout in other tabs)
  sb.auth.onAuthStateChange((event, session) => {
    if(event === 'SIGNED_OUT' && el('appWrap').style.display === 'block'){
      location.reload();
    }
  });

  init();
</script>
</body>
</html>
